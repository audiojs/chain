name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # package-lock.json is not in the repository (.gitignore): npm i in place of npm ci, and no npm cache keyed on it
      - name: Install dependencies
        run: npm i

      - name: Run tests
        run: npm test
